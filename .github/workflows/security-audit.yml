name: CI · Tests & Security Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC
  workflow_dispatch:

jobs:
  backend:
    name: Backend · tests + pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider
      - name: pip-audit (dependency vulnerabilities)
        working-directory: backend
        continue-on-error: true   # report advisories without blocking the build
        run: |
          pip install pip-audit
          pip-audit --desc

  frontend:
    name: Frontend · npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate lockfile (no scripts)
        working-directory: frontend
        continue-on-error: true
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: npm audit (high severity)
        working-directory: frontend
        continue-on-error: true   # surfaces advisories without blocking the build
        run: npm audit --omit=dev --audit-level=high
